allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cosmokit@1.8.4'
  - '@deepseek-ai/schemastery@3.18.3'
  - source-map-js@1.2.2

# Pin vulnerable transitive packages to the minimum patched versions from the audit.
overrides:
  '@modelcontextprotocol/sdk': 1.32.0
  body-parser: 2.4.0
  fast-uri: 3.1.9
  ip-address: 10.7.4
  qs: 6.16.1
  undici: 7.30.1
  vite: 7.3.7
  'zod@^4': 4.6.6
