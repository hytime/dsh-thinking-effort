name: Publish cleanup fixture
on:
  push:
    tags: ['v*.*.*']
jobs:
  compatibility:
    steps:
      - name: Cleanup temporary compatibility resources
        if: ${{ always() }}
        run: |
          rm -rf "${RUN_ROOT:-${{ runner.temp }}/dsh-thinking-effort-compat-${{ github.run_id }}-${{ github.run_attempt }}"
